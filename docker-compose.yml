services:
  app:
    build: .
    container_name: task-management-app
    restart: always
    ports:
      - "3010:4411"   
    environment:
      PORT: 4411
      DB_HOST: task-postgres  
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 391351
      DB_NAME: task_db
      SESSION_SECRET: dev_session_secret
    depends_on:
      - task-postgres
    networks:
      - task-net
    volumes:
      - .:/app               

  task-postgres:
    image: postgres:15-alpine
    container_name: task-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 391351
      POSTGRES_DB: task_db
    ports:
      - "5436:5432"  
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    networks:
      - task-net

  task-redis:
    image: redis:7-alpine
    container_name: task-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=391351
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - task-net
    restart: unless-stopped
  
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:task-redis:6379:0:391351
    depends_on:
      - task-redis
    networks:
      - task-net
    restart: unless-stopped

networks:
  task-net:
    driver: bridge

volumes:
  task_postgres_data:
  redis_data:
